services:
  - type: web
    name: bearing-monitor-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/deploy.py
    healthCheckPath: /api/model-comparison
    disk:
      name: bearing-monitor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BEARING_DATA_DIR
        value: /var/data/cwru
      - key: BEARING_MODEL_DIR
        value: /var/data/models
      - key: BEARING_RESULTS_PATH
        value: /var/data/results.json
      - key: CORS_ORIGINS
        value: http://localhost:8000,http://127.0.0.1:8000
      - key: TRAINING_TOKEN
        sync: false
